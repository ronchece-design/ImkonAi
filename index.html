<title>IMKON — imkoniyatlar bir joyda</title>

<style>
:root{--bg:#F5F6FB;--ink:#0E1745;--muted:#55608A;--brand:#2338C9;--on-brand:#fff;--sun:#FFC62E;--card:#fff;--line:#DDE1F2;--ok:#127A4B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1030;--ink:#EEF0FF;--muted:#A3ABD6;--brand:#8E9CFF;--on-brand:#0B1030;--card:#141B47;--line:#28316B;--ok:#5FD39A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1030;--ink:#EEF0FF;--muted:#A3ABD6;--brand:#8E9CFF;--on-brand:#0B1030;--card:#141B47;--line:#28316B;--ok:#5FD39A;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Manrope,system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Manrope,sans-serif;line-height:1.1;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
.hero{padding:44px 0 26px}
.logo{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(64px,19vw,150px);letter-spacing:-.04em;line-height:.9;margin:0}
.logo span{background:var(--sun);color:#0E1745;padding:0 .08em;border-radius:.12em;display:inline-block;transform:rotate(-2deg)}
.tag{font-size:19px;max-width:30ch;margin:18px 0 22px;color:var(--muted)}
.paths{display:flex;flex-wrap:wrap;gap:10px}
.paths button{background:var(--brand);color:var(--on-brand);border:0;border-radius:999px;padding:12px 20px;font-weight:700}
.paths button:nth-child(2){background:var(--sun);color:#0E1745}
.paths button:nth-child(3){background:transparent;color:var(--ink);border:2px solid var(--ink)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.tabs button{flex:none;background:none;border:0;border-radius:10px;padding:8px 14px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
main{padding:28px 0 60px;min-height:60vh}
.pane{display:none}.pane.on{display:block}
h2{font-size:clamp(28px,6vw,40px);margin-bottom:6px}
.lead{color:var(--muted);margin:0 0 22px;max-width:60ch}
.note{font-size:14px;color:var(--muted);border-left:4px solid var(--sun);padding:4px 12px;margin:0 0 22px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{font-size:20px;margin-bottom:6px}
.card p{margin:0 0 12px;color:var(--muted);font-size:15px}
.chip{display:inline-block;font-size:13px;font-weight:700;border-radius:8px;padding:2px 9px;background:var(--line);margin:0 6px 6px 0}
.chip.y{background:var(--sun);color:#0E1745}
.row{display:grid;grid-template-columns:64px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.date{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;text-align:center;line-height:1}
.date b{display:block;font-size:30px}.date small{font-size:13px;color:var(--muted);font-weight:500}
.row h3{font-size:20px}.row p{margin:4px 0 0;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.filters button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600}
.filters button[aria-pressed=true]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn{background:var(--brand);color:var(--on-brand);border:0;border-radius:10px;padding:9px 16px;font-weight:700}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:10px}
summary{cursor:pointer;font-weight:700;font-size:17px}
details p,details ul{color:var(--muted);margin:10px 0 0}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.check input{width:22px;height:22px;margin-top:3px;accent-color:var(--brand)}
.prog{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:0 0 18px}
.prog i{display:block;height:100%;width:0;background:var(--sun);transition:width .3s}
form{display:grid;gap:12px;max-width:460px}
label{font-weight:700;font-size:15px;display:grid;gap:4px}
input[type=text],input[type=email],select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
#ok{color:var(--ok);font-weight:700;display:none}
footer{border-top:1px solid var(--line);padding:22px 0 30px;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.lang{display:flex;gap:6px;justify-content:flex-end;padding-top:14px}
.lang button{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:4px 12px;font-weight:700}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
</style>
</head>

function chips(a){return a.map(function(c){return '<span class="chip">'+esc(c)+'</span>'}).join("")}
function render(){var d=L[lang];document.documentElement.lang=lang;document.title=d.t.title;
document.querySelectorAll("[data-t]").forEach(function(n){n.textContent=d.t[n.dataset.t]});
document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.l==lang)});
$("tabs").innerHTML=d.tabs.map(function(t,i){return '<button role="tab" data-go="'+NAMES.ids[i]+'" aria-selected="'+(NAMES.ids[i]==cur)+'">'+esc(t)+'</button>'}).join("");
$("news").innerHTML=d.news.map(function(n,i){return '<div class="row"><div class="date"><b>'+NAMES.date[i]+'</b><small>'+d.mon+'</small></div><div><span class="chip y">'+d.sample+'</span><h3>'+esc(n[0])+'</h3><p>'+esc(n[1])+'</p></div></div>'}).join("");
$("vol").innerHTML=d.vol.map(function(v){return '<div class="card"><h3>'+esc(v[0])+'</h3><p>'+esc(v[1])+'</p><div><span class="chip y">'+esc(v[2])+'</span>'+chips([v[3],v[4]])+'</div><button class="btn" data-go="aloqa">'+d.apply+'</button></div>'}).join("");
$("uf").innerHTML=d.filt.map(function(f,i){return '<button data-f="'+i+'" aria-pressed="'+(i==F)+'">'+esc(f)+'</button>'}).join("");
$("unis").innerHTML=NAMES.uni.map(function(u,i){return [u,i]}).filter(function(x){var u=x[0];return F==0||(F==1&&u[1]=="T"&&!u[2])||(F==2&&u[1]!="T")||(F==3&&u[2])}).map(function(x){var u=x[0];return '<div class="card"><h3>'+esc(u[0])+'</h3><p>'+esc(d.uni[x[1]])+'</p><span class="chip y">'+esc(d.city[u[1]])+'</span>'+chips([d.type[u[2]]])+'</div>'}).join("");
$("intl").innerHTML=d.intl.map(function(c,i){return '<div class="card"><h3>'+esc(c[0])+'</h3><p>'+esc(NAMES.intl[i])+'</p><span class="chip y">'+esc(c[1])+'</span>'+chips([c[2]])+'</div>'}).join("");
$("abroad").innerHTML=d.ab.map(function(a,i){return '<details><summary>'+esc(NAMES.ab[i])+'</summary><p>'+esc(a)+' '+d.abs+'</p></details>'}).join("");
$("sel").innerHTML=d.sel.map(function(s){return '<option>'+esc(s)+'</option>'}).join("");
$("todo").innerHTML=d.steps.map(function(s,i){return '<label class="check"><input type="checkbox" data-i="'+i+'"'+(done[i]?" checked":"")+'><span>'+esc(s)+'</span></label>'}).join("");
$("bar").style.width=Math.round(100*d.steps.filter(function(_,i){return done[i]}).length/d.steps.length)+"%"}
function show(id,scroll){if(!$("p-"+id))id="yangilik";cur=id;
document.querySelectorAll(".pane").forEach(function(p){p.classList.toggle("on",p.id=="p-"+id)});
document.querySelectorAll("#tabs button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.go==id)});
try{history.replaceState(null,"","#"+id)}catch(e){}
if(scroll){window.scrollTo({top:document.querySelector("main").offsetTop-60,behavior:"smooth"})}}
document.addEventListener("click",function(e){var g=e.target.closest("[data-go]"),l=e.target.closest("[data-l]"),f=e.target.closest("#uf button");
if(g)show(g.dataset.go,true);
if(l){lang=l.dataset.l;try{localStorage.setItem("imkon_lang",lang)}catch(x){}render()}
if(f){F=+f.dataset.f;render()}});
$("todo").addEventListener("change",function(e){done[e.target.dataset.i]=e.target.checked;try{localStorage.setItem("imkon_todo",JSON.stringify(done))}catch(x){}render()});
$("f").addEventListener("submit",function(e){e.preventDefault();$("ok").style.display="block";e.target.reset()});
cur=(location.hash||"").slice(1)||"yangilik";render();show(cur,false);
</script>
</body>
</html>
