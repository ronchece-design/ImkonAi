table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}td,th{padding:9px 12px;border-bottom:1px solid var(--b);text-align:left}

dash(){const u=user();if(!u)return`<h2>${t('dash')}</h2><div class="grid"><div class="card"><h3>${t('login')}</h3><div class="row"><input id="l_e" placeholder="Email" type="email"><input id="l_p" placeholder="Password" type="password"><button onclick="login()">${t('login')}</button></div></div><div class="card"><h3>${t('reg')}</h3><div class="row"><input id="r_n" placeholder="Name"><input id="r_e" placeholder="Email" type="email"><input id="r_p" placeholder="Password (8+)" type="password"><button onclick="register()">${t('reg')}</button></div></div></div><p class="m">Demo auth stored in this browser only. Replace with Supabase Auth in production.</p>`;
const dl=G('dl_'+u.email,[]).sort((a,b)=>a.d>b.d?1:-1),sv=saved().map(find).filter(Boolean);
return`<h2>${esc(u.name)} <button class="sm alt" onclick="logout()">${t('out')}</button> ${u.role==='admin'?'<a class="btn sm" href="#/admin">Admin</a>':''}</h2><h3>Saved</h3>${grid(sv)}<h3>Deadline tracker</h3><div class="row"><input id="d_t" placeholder="Title"><input id="d_d" type="date"><select id="d_k"><option value="c">Confirmed (official)</option><option value="e">Estimated / unverified</option></select><button onclick="addDl()">Add</button></div><table>${dl.map((d,k)=>`<tr><td>${esc(d.d)}</td><td>${esc(d.t)}</td><td><span class="tag ${d.k==='c'?'o':'w'}">${d.k==='c'?'Confirmed':'Estimated'}</span></td><td><button class="sm alt" onclick="delDl(${k})">×</button></td></tr>`).join('')||'<tr><td class="m">—</td></tr>'}</table>
<h3>Suggest an opportunity (moderated)</h3><div class="row"><input id="s_n" placeholder="Title"><input id="s_u" placeholder="Official URL https://"><select id="s_t"><option value="sch">Scholarship</option><option value="uni">University</option><option value="prog">Program</option><option value="comp">Competition</option><option value="intern">Internship</option><option value="course">Course</option></select><button onclick="suggest()">Submit</button></div><p><a href="#/path">${t('path')}</a></p>`},
admin(){const u=user();if(!u||u.role!=='admin')return'<p>403</p>';const a=G('added',[]);const us=G('users',[]);
return`<h2>Admin</h2><p class="m">Users: ${us.length} · Added records: ${a.length} · Pending: ${a.filter(i=>i.s==='pending').length} · Saved items: ${saved().length}</p><div class="row"><input id="a_n" placeholder="Name"><input id="a_c" placeholder="Country"><input id="a_u" placeholder="Source URL https://"><select id="a_t"><option value="uni">uni</option><option value="sch">sch</option><option value="prog">prog</option><option value="comp">comp</option><option value="intern">intern</option><option value="course">course</option><option value="news">news</option></select><button onclick="adminAdd()">Add</button></div>
<table>${a.map((i,k)=>`<tr><td>${esc(i.n)}</td><td>${i.t}</td><td><select onchange="setSt(${k},this.value)">${['pending','nv','open','up','closed'].map(s=>`<option ${i.s===s?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="sm alt" onclick="setSt(${k},'ver')">Mark verified</button> <button class="sm alt" onclick="delAdd(${k})">×</button></td></tr>`).join('')}</table>`}};
/* ===== Actions ===== */
async function hash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('imkon:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function register(){const n=$('#r_n').value.trim(),e=$('#r_e').value.trim().toLowerCase(),p=$('#r_p').value;if(!n||!/^\S+@\S+\.\S+$/.test(e)||p.length<8)return alert('Check name, email, password (8+).');const us=G('users',[]);if(us.find(x=>x.email===e))return alert('Exists');const u={name:n,email:e,h:await hash(p),role:us.length?'user':'admin'};us.push(u);P('users',us);P('session',{name:n,email:e,role:u.role});route()}
async function login(){const e=$('#l_e').value.trim().toLowerCase(),h=await hash($('#l_p').value),u=G('users',[]).find(x=>x.email===e&&x.h===h);if(!u)return alert('Wrong email or password');P('session',{name:u.name,email:u.email,role:u.role});route()}
function logout(){localStorage.removeItem('session');route()}
function addDl(){const u=user(),k='dl_'+u.email,a=G(k,[]);if(!$('#d_t').value||!$('#d_d').value)return;a.push({t:$('#d_t').value,d:$('#d_d').value,k:$('#d_k').value});P(k,a);route()}
function delDl(i){const k='dl_'+user().email,a=G(k,[]);a.splice(i,1);P(k,a);route()}
function addRec(n,u,t,c,s){if(!n||!/^https?:\/\//.test(u))return alert('Name and official URL (https://) are required.');const a=G('added',[]);a.push({id:'x'+Date.now(),t,n,c:c||'—',l:'—',f:'—',u,src:u,s,ver:s==='pending'?'—':new Date().toISOString().slice(0,10)});P('added',a);route()}
function suggest(){addRec($('#s_n').value,$('#s_u').value,$('#s_t').value,'','pending');alert('Sent for moderation.')}
function adminAdd(){addRec($('#a_n').value,$('#a_u').value,$('#a_t').value,$('#a_c').value,'nv')}
function setSt(i,v){const a=G('added',[]);if(v==='ver'){a[i].ver=new Date().toISOString().slice(0,10);if(a[i].s==='pending')a[i].s='nv'}else a[i].s=v;P('added',a);route()}
function delAdd(i){const a=G('added',[]);a.splice(i,1);P('added',a);route()}
function mkPath(){P('path',{f:$('#p_f').value,c:$('#p_c').value,l:$('#p_l').value,done:[]});route()}
function pDone(k){const p=G('path');p.done=p.done.includes(k)?p.done.filter(x=>x!==k):p.done.concat(k);P('path',p)}
async function askAI(){const q=$('#aq').value.trim();if(!q)return;const c=$('#chat');c.innerHTML+=`<p class="u">${esc(q)}</p>`;$('#aq').value='';let a;
if(CONFIG.AI_ENDPOINT){try{const r=await fetch(CONFIG.AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q,lang})});a=esc((await r.json()).answer)}catch(e){}}
if(!a){const w=q.toLowerCase().split(/\W+/).filter(x=>x.length>2);const r=items().map(i=>({i,s:w.filter(x=>(i.n+i.c+i.f+i.l+i.t).toLowerCase().includes(x)).length})).filter(x=>x.s).sort((x,y)=>y.s-x.s).slice(0,3);
a=/checklist|документ|hujjat/i.test(q)?'Checklist: 1) target list, 2) official requirements, 3) language/entrance exam, 4) CV + motivation letter, 5) recommendations, 6) confirm deadline on the official site, 7) apply.':
r.length?r.map(x=>`<a href="#/item/${x.i.id}">${esc(x.i.n)}</a> (${esc(x.i.c)}) — deadline & requirements: <b>${t('nv')}</b>. Source: <a href="${esc(x.i.u)}" target="_blank" rel="noopener">${esc(x.i.u)}</a>`).join('<br>'):'I have no verified record for that — it needs verification. Try the official sources in the catalog.'}
c.innerHTML+=`<p>${a}</p>`}
/* ===== Router ===== */
function route(keep){const h=location.hash.replace(/^#\/?/,'').split('/'),p=h[0]||'home',arg=h.slice(1).join('/');const fq=keep&&$('#f_q'),pos=fq?fq.selectionStart:0;
const m={home:'home',uni:'uni',sch:'sch',prog:'prog',comp:'comp',course:'course'};let html;
if(m[p]&&p!=='home')html=V.catalog(p);else if(V[p])html=V[p](arg);else html=V.home();
$('#app').innerHTML=html;if(fq){const e=$('#f_q');e.focus();e.setSelectionRange(pos,pos)}
$('#nav').innerHTML=NAV.map(k=>`<a href="#/${k==='home'?'':k}" class="${p===k||(k==='home'&&p==='home')?'on':''}">${t(k)}</a>`).join('');
$('#q').placeholder=t('ph');$('#demo').textContent=t('demo');$('#foot').textContent=t('foot');document.documentElement.lang=lang==='kk'?'kk':lang;
if(!keep)scrollTo(0,0)}
$('#lang').value=lang;$('#lang').onchange=e=>{lang=e.target.value;localStorage.setItem('lang',lang);route()};
$('#q').onkeydown=e=>{if(e.key==='Enter')location.hash='#/search/'+encodeURIComponent(e.target.value)};
addEventListener('hashchange',()=>route());route();
</script></body></html>
